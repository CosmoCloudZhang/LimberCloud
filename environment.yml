# Portable CPU recipe for LimberCloud (laptops / non-NERSC).
# Name: limbercloud. Excludes CosmoSIS. Uses CPU JAX and serial h5py.
# On NERSC, prefer environment.nersc.yml and scripts/nersc/install_mpi_h5py.sh
# so mpi4py/h5py are built against Cray MPICH and cray-hdf5-parallel.

name: limbercloud

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python >=3.12,<3.13
  - pip
  - setuptools >=61
  - numpy >=2.2,<2.3
  - scipy >=1.13,<1.14
  - numba >=0.63,<0.64
  - astropy >=7.2,<7.3
  - matplotlib >=3.10,<3.11
  - pyccl >=3.2,<3.3
  - camb >=1.6,<1.7
  - h5py >=3.15,<3.16
  - mpi4py >=4.1,<4.2
  - ipykernel >=7.1,<7.2
  - ruff >=0.16,<0.17
  - pip:
      - "jax[cpu]>=0.9.1,<0.10"
