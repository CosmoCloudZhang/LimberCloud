# NERSC CUDA variant for LimberCloud.
# Scientific pins match environment.yml where possible.
# Do NOT install generic Conda mpi4py/h5py here: after env create, activate
# limbercloud, load scripts/nersc/modules/cpu.sh (or gpu.sh), then run
# scripts/nersc/install_mpi_h5py.sh to build against Cray MPICH / HDF5.
# Excludes CosmoSIS. Preserve CosmoConda until this environment is validated.

name: limbercloud

channels:
  - conda-forge
  - nodefaults

dependencies:
  - python >=3.12,<3.13
  - pip
  - setuptools >=61
  - numpy >=2.2,<2.3
  - scipy >=1.13,<1.14
  - numba >=0.63,<0.64
  - astropy >=7.2,<7.3
  - matplotlib >=3.10,<3.11
  - pyccl >=3.2,<3.3
  - camb >=1.6,<1.7
  - cython >=3.0
  - pkgconfig
  - ipykernel >=7.1,<7.2
  - ruff >=0.16,<0.17
  - pip:
      - "jax[cuda12]>=0.9.1,<0.10"
