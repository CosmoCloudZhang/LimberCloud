[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "limbercloud"
version = "0.1.0"
description = "Fast analytic Limber angular-power-spectrum calculations."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [
    {name = "LimberCloud collaboration"},
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16,<0.17",
]
notebooks = [
    "ipython",
    "sympy>=1.14,<2",
]
science = [
    "astropy",
    "camb",
    "h5py",
    "jax",
    "matplotlib",
    "mpi4py",
    "numba",
    "numpy",
    "pyccl",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP032", "W291", "W293"]

[tool.ruff.lint.pydocstyle]
convention = "google"
