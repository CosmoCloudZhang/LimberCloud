[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "limbercloud"
version = "0.1.0"
description = "Fast analytic Limber angular-power-spectrum calculations."
readme = "README.md"
requires-python = ">=3.9"
authors = [
    {name = "LimberCloud collaboration"},
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16,<0.17",
]
science = [
    "astropy",
    "jax",
    "matplotlib",
    "numba",
    "numpy",
    "pyccl",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py39"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP032", "W291", "W293"]
